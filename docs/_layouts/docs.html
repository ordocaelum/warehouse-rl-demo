---
layout: default
---
<section class="doc-shell container">
  <header class="page-hero reveal">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  {% if page.toc %}
  <nav class="doc-toc reveal" aria-label="Section navigation">
    {% for entry in page.toc %}
    <a href="#{{ entry.id }}">{{ entry.title }}</a>
    {% endfor %}
  </nav>
  {% endif %}
  <article class="page-content reveal">
    {{ content }}
  </article>
</section>
